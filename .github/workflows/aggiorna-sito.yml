name: Aggiorna sito

# Ogni ora rilegge il feed del blog e il canale YouTube, rigenera le pagine e le pubblica su GitHub Pages.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna-sito
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera le pagine
        run: |
          # Finche' l'archivio e' piccolo recupera piu' pagine del feed del blog
          PAGES=2
          N=$(python3 -c 'import json;print(len(json.load(open("data/posts.json"))))' 2>/dev/null || echo 0)
          if [ "$N" -lt 30 ]; then PAGES=10; fi
          python3 scripts/build.py --pages "$PAGES"
      - name: Salva l'archivio aggiornato
        run: |
          git config user.name "intermarketandmore-bot"
          git config user.email "intermarketandmore@users.noreply.github.com"
          git add -A index.html focus-mercati data
          if git diff --cached --quiet; then echo "Nessuna novita'"; else git commit -m "Aggiornamento automatico del sito" && git push; fi
      - name: Prepara la pubblicazione
        run: |
          mkdir -p _site
          cp -r index.html focus-mercati assets .nojekyll _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
